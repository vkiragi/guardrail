<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guardrail — decision log</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; padding: 24px;
      font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1115; color: #e6e6e6;
    }
    header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
    h1 { font-size: 20px; margin: 0; }
    .sub { color: #8a8f98; font-size: 13px; }
    form.ask:not([hidden]) { display: flex; gap: 8px; margin: 0 0 16px; }
    form.ask input {
      flex: 1; padding: 9px 12px; border-radius: 6px; font: inherit;
      border: 1px solid #2a2e37; background: #161920; color: #e6e6e6;
    }
    form.ask input:focus { outline: none; border-color: #4a5568; }
    form.ask button {
      padding: 9px 14px; border-radius: 6px; font: inherit; cursor: pointer;
      border: 1px solid #2a2e37; background: #21262d; color: #e6e6e6;
    }
    form.ask button:hover:not(:disabled) { background: #2a3038; }
    form.ask :disabled { opacity: .5; cursor: default; }
    .status { margin: 8px 0 16px; color: #8a8f98; font-size: 12px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 10px; vertical-align: top; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #8a8f98; border-bottom: 1px solid #2a2e37; }
    tbody tr { border-bottom: 1px solid #1c2027; }
    tr.approved { background: rgba(46, 160, 67, .12); }
    tr.blocked  { background: rgba(218, 54, 51, .12); }
    tr.passed   { background: rgba(138, 143, 152, .07); }
    .tag { font-weight: 600; font-size: 12px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
    .tag.approved { background: #2ea043; color: #fff; }
    .tag.blocked  { background: #da3633; color: #fff; }
    .tag.passed   { background: #3d434c; color: #c9ced6; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: #b8bcc4; }
    .reason { color: #cfd3da; }
    .empty { color: #8a8f98; padding: 24px 10px; }
  </style>
</head>
<body>
  <header>
    <h1>Guardrail</h1>
    <span class="sub">pre-trade decision log</span>
  </header>
  <div class="status" id="status">loading…</div>
  <form class="ask" id="ask" hidden>
    <input id="instruction" autocomplete="off"
           placeholder="e.g. put 80% of the account into Tesla">
    <button type="submit">Send</button>
    <button type="button" id="cycle">Run agent cycle</button>
  </form>
  <table>
    <thead>
      <tr>
        <th>Time</th><th>Symbol</th><th>Side</th><th>Qty</th>
        <th>Rationale</th><th>Decision</th><th>Reason</th><th>Order</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    const rowsEl = document.getElementById("rows");
    const statusEl = document.getElementById("status");
    const askEl = document.getElementById("ask");
    const instructionEl = document.getElementById("instruction");

    function timeOf(ts) {
      const d = new Date(ts);
      return isNaN(d) ? ts : d.toLocaleTimeString();
    }
    function esc(s) {
      return (s == null ? "" : String(s)).replace(/[&<>]/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    }

    const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    function prettySymbol(sym) {
      // AAPL260911C00325000 -> AAPL $325 call · 11 Sep
      const m = /^([A-Z]+)(\d{2})(\d{2})(\d{2})([CP])(\d{8})$/.exec(sym || "");
      if (!m) return esc(sym);
      const strike = (parseInt(m[6], 10) / 1000).toLocaleString(undefined, { maximumFractionDigits: 2 });
      return `${esc(m[1])} $${strike} ${m[5] === "C" ? "call" : "put"} <span class="mono">· ${parseInt(m[4],10)} ${MONTHS[parseInt(m[3],10)-1]}</span>`;
    }

    function render(decisions) {
      if (!decisions.length) {
        rowsEl.innerHTML = '<tr><td class="empty" colspan="8">No decisions yet.</td></tr>';
        return;
      }
      rowsEl.innerHTML = decisions.map(d => {
        const ok = d.allowed === 1;
        const skipped = d.rule_id === "agent_skip";
        const cls = ok ? "approved" : (skipped ? "passed" : "blocked");
        const tag = ok ? "APPROVED" : (skipped ? "PASSED" : "BLOCKED");
        const order = d.order_id ? esc(d.order_id).slice(0, 8) : "—";
        return `<tr class="${cls}">
          <td class="mono">${esc(timeOf(d.ts))}</td>
          <td>${prettySymbol(d.symbol)}</td>
          <td>${esc(d.side)}</td>
          <td class="mono">${esc(d.qty)}</td>
          <td class="reason">${esc(d.rationale)}</td>
          <td><span class="tag ${cls}">${tag}</span></td>
          <td class="reason">${esc(d.reason)}</td>
          <td class="mono">${order}</td>
        </tr>`;
      }).join("");
    }

    async function fetchDecisions() {
      // Live server first; on a static host (no backend) fall back to the snapshot.
      try {
        const r = await fetch("/api/decisions");
        if (r.ok && (r.headers.get("content-type") || "").includes("application/json")) {
          askEl.hidden = false;   // live backend: controls are usable
          return await r.json();
        }
      } catch (e) { /* no server — use the snapshot */ }
      askEl.hidden = true;        // static snapshot: read only
      const r = await fetch("./decisions.json");
      return await r.json();
    }

    async function poll() {
      try {
        const data = await fetchDecisions();
        render(data);
        statusEl.textContent = `${data.length} decisions · updated ${new Date().toLocaleTimeString()}`;
      } catch (e) {
        statusEl.textContent = "connection lost, retrying…";
      }
    }

    async function send(url, body) {
      const controls = askEl.querySelectorAll("input, button");
      controls.forEach(c => (c.disabled = true));
      statusEl.textContent = "working… this can take ~20 seconds";
      try {
        await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body || {}),
        });
      } catch (e) { /* the outcome shows up in the log either way */ }
      controls.forEach(c => (c.disabled = false));
      poll();
    }

    askEl.addEventListener("submit", e => {
      e.preventDefault();
      const value = instructionEl.value.trim();
      if (!value) return;
      instructionEl.value = "";
      send("/api/instruct", { instruction: value });
    });
    document.getElementById("cycle").addEventListener("click", () => send("/api/cycle"));

    poll();
    setInterval(poll, 3000);
  </script>
</body>
</html>
